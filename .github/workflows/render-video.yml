name: Yappu TV Video Renderer

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "Find the Hidden Apple"

      duration:
        description: "Video duration in seconds"
        required: true
        default: "20"

      voice_url:
        description: "ElevenLabs voice file URL (optional)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # INSTALL
      # --------------------------------------------------

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil espeak-ng

      # --------------------------------------------------
      # CHECK LOGO
      # --------------------------------------------------

      - name: Check Yappu TV logo
        run: |
          if [ ! -f "GitHub Workflow/yappu-logo.png" ]; then
            echo "ERROR: yappu-logo.png not found"
            exit 1
          fi

          echo "Yappu TV logo found."

      # --------------------------------------------------
      # CREATE VIDEO
      # --------------------------------------------------

      - name: Create Yappu TV Creative V3
        env:
          TOPIC: ${{ inputs.topic }}
          DURATION: ${{ inputs.duration }}
          VOICE_URL: ${{ inputs.voice_url }}

        run: |

          mkdir -p output frames audio

          T="$TOPIC"
          TL=$(echo "$T" | tr '[:upper:]' '[:lower:]')

          # ------------------------------------------------
          # TARGET DETECTION
          # ------------------------------------------------

          if [[ "$TL" == *"rainbow"* ]]; then
            TARGET="RAINBOW"

          elif [[ "$TL" == *"dino"* || "$TL" == *"dinosaur"* ]]; then
            TARGET="DINO"

          elif [[ "$TL" == *"pen"* ]]; then
            TARGET="PEN"

          elif [[ "$TL" == *"star"* ]]; then
            TARGET="STAR"

          elif [[ "$TL" == *"heart"* ]]; then
            TARGET="HEART"

          elif [[ "$TL" == *"ball"* ]]; then
            TARGET="BALL"

          else
            TARGET="APPLE"
          fi

          export TARGET

          # ------------------------------------------------
          # COPY LOGO
          # ------------------------------------------------

          cp "GitHub Workflow/yappu-logo.png" frames/yappu-logo.png

          # ------------------------------------------------
          # PYTHON ANIMATION ENGINE
          # ------------------------------------------------

          python3 <<'PY'

          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import os
          import math
          import random

          W = 1080
          H = 1920
          FPS = 30

          topic = os.environ.get("TOPIC", "Find the Hidden Apple")
          target = os.environ.get("TARGET", "APPLE")

          random.seed(topic)

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          try:
              f_title = ImageFont.truetype(FONT, 90)
              f_big = ImageFont.truetype(FONT, 150)
              f_medium = ImageFont.truetype(FONT, 62)
              f_small = ImageFont.truetype(FONT, 44)
          except:
              f_title = f_big = f_medium = f_small = ImageFont.load_default()

          LOGO = Image.open("frames/yappu-logo.png").convert("RGBA")

          # Resize logo
          logo_w = 250
          ratio = logo_w / LOGO.width
          logo_h = int(LOGO.height * ratio)
          LOGO = LOGO.resize((logo_w, logo_h), Image.Resampling.LANCZOS)

          # ------------------------------------------------
          # HELPERS
          # ------------------------------------------------

          def rounded_text(img, text, y, font, fill):

              d = ImageDraw.Draw(img)

              box = d.textbbox((0,0), text, font=font)
              tw = box[2] - box[0]
              th = box[3] - box[1]

              x = (W - tw) // 2

              # shadow
              d.text(
                  (x+5, y+6),
                  text,
                  font=font,
                  fill=(20,20,45)
              )

              d.text(
                  (x,y),
                  text,
                  font=font,
                  fill=fill
              )

          def paste_logo(img, scale=1.0):

              lw = int(LOGO.width * scale)
              lh = int(LOGO.height * scale)

              logo = LOGO.resize(
                  (lw,lh),
                  Image.Resampling.LANCZOS
              )

              x = (W-lw)//2
              y = 35

              img.alpha_composite(
                  logo,
                  (x,y)
              )

          def circle_object(kind, size=70):

              s = size
              obj = Image.new(
                  "RGBA",
                  (s*3,s*3),
                  (0,0,0,0)
              )

              d = ImageDraw.Draw(obj)

              cx = s*1.5
              cy = s*1.5

              if kind == "APPLE":

                  d.ellipse(
                      (cx-s,cy-s,cx,cy),
                      fill=(238,45,65)
                  )

                  d.ellipse(
                      (cx,cy-s,cx+s,cy),
                      fill=(238,45,65)
                  )

                  d.rectangle(
                      (cx-5,cy-s-25,cx+5,cy-s+5),
                      fill=(100,55,25)
                  )

                  d.ellipse(
                      (cx+5,cy-s-30,cx+40,cy-s),
                      fill=(55,190,90)
                  )

              elif kind == "BALL":

                  d.ellipse(
                      (cx-s,cy-s,cx+s,cy+s),
                      fill=(50,130,245)
                  )

                  d.arc(
                      (cx-s//2,cy-s//2,
                       cx+s//2,cy+s//2),
                      0,360,
                      fill="white",
                      width=8
                  )

              elif kind == "STAR":

                  pts=[]

                  for i in range(10):

                      a = -math.pi/2 + i*math.pi/5

                      r = s if i%2==0 else s*0.45

                      pts.append(
                          (
                              cx+math.cos(a)*r,
                              cy+math.sin(a)*r
                          )
                      )

                  d.polygon(
                      pts,
                      fill=(255,210,45)
                  )

              elif kind == "HEART":

                  d.ellipse(
                      (cx-s,cy-s//2,cx,cy+s),
                      fill=(250,55,100)
                  )

                  d.ellipse(
                      (cx,cy-s//2,cx+s,cy+s),
                      fill=(250,55,100)
                  )

                  d.polygon(
                      [
                          (cx-s+5,cy),
                          (cx+s-5,cy),
                          (cx,cy+s+s//2)
                      ],
                      fill=(250,55,100)
                  )

              elif kind == "PEN":

                  d.rounded_rectangle(
                      (
                          cx-s//4,
                          cy-s,
                          cx+s//4,
                          cy+s
                      ),
                      radius=15,
                      fill=(50,100,230)
                  )

                  d.polygon(
                      [
                          (cx-s//4,cy+s),
                          (cx+s//4,cy+s),
                          (cx,cy+s+45)
                      ],
                      fill=(70,70,80)
                  )

              elif kind == "DINO":

                  d.ellipse(
                      (
                          cx-s,
                          cy-s//2,
                          cx+s,
                          cy+s//2
                      ),
                      fill=(65,195,100)
                  )

                  d.ellipse(
                      (
                          cx+s//2,
                          cy-s,
                          cx+s*1.2,
                          cy-s//3
                      ),
                      fill=(65,195,100)
                  )

                  # eye
                  d.ellipse(
                      (
                          cx+s*0.85,
                          cy-s*0.75,
                          cx+s*0.98,
                          cy-s*0.62
                      ),
                      fill="white"
                  )

              return obj

          # ------------------------------------------------
          # PUZZLE POSITIONS
          # ------------------------------------------------

          positions=[]

          for row in range(5):

              for col in range(4):

                  positions.append(
                      (
                          155 + col*255,
                          600 + row*210
                      )
                  )

          hidden_index = random.randrange(
              len(positions)
          )

          allowed = [
              "APPLE",
              "BALL",
              "STAR",
              "HEART",
              "DINO",
              "PEN"
          ]

          # ------------------------------------------------
          # TOTAL FRAMES
          # ------------------------------------------------

          total_frames = 600

          for frame in range(total_frames):

              t = frame / FPS

              # --------------------------------------------
              # BACKGROUND
              # --------------------------------------------

              if t < 3:

                  # HOOK

                  bg = (
                      35,
                      22,
                      85
                  )

              elif t < 13:

                  # PUZZLE

                  bg = (
                      245,
                      249,
                      255
                  )

              elif t < 16:

                  # COUNTDOWN

                  bg = (
                      38,
                      24,
                      82
                  )

              else:

                  # REVEAL

                  bg = (
                      25,
                      110,
                      82
                  )

              img = Image.new(
                  "RGBA",
                  (W,H),
                  bg+(255,)
              )

              d = ImageDraw.Draw(img)

              # --------------------------------------------
              # LOGO
              # --------------------------------------------

              paste_logo(img)

              # --------------------------------------------
              # HOOK 0-3
              # --------------------------------------------

              if t < 3:

                  pulse = 1 + 0.08 * math.sin(t*8)

                  rounded_text(
                      img,
                      "CAN YOU",
                      390,
                      f_title,
                      (255,235,70)
                  )

                  rounded_text(
                      img,
                      "FIND IT?",
                      500,
                      f_title,
                      (255,255,255)
                  )

                  obj = circle_object(
                      target,
                      90
                  )

                  obj = obj.resize(
                      (
                          int(obj.width*pulse),
                          int(obj.height*pulse)
                      )
                  )

                  x = (W-obj.width)//2

                  y = 760 + int(
                      math.sin(t*6)*20
                  )

                  img.alpha_composite(
                      obj,
                      (x,y)
                  )

                  rounded_text(
                      img,
                      "GET READY!",
                      1370,
                      f_medium,
                      (100,235,255)
                  )

              # --------------------------------------------
              # PUZZLE 3-13
              # --------------------------------------------

              elif t < 13:

                  rounded_text(
                      img,
                      "FIND THE HIDDEN",
                      205,
                      f_medium,
                      (35,45,80)
                  )

                  rounded_text(
                      img,
                      target,
                      285,
                      f_title,
                      (245,70,100)
                  )

                  elapsed = t - 3

                  for i,(x,y) in enumerate(
                      positions
                  ):

                      kind = random.choice(
                          allowed
                      )

                      if i == hidden_index:
                          kind = target

                      # gentle movement
                      dx = int(
                          math.sin(
                              elapsed*2+i
                          )*8
                      )

                      dy = int(
                          math.cos(
                              elapsed*2.3+i
                          )*7
                      )

                      scale = 0.92 + 0.08 * math.sin(
                          elapsed*3+i
                      )

                      obj = circle_object(
                          kind,
                          55
                      )

                      obj = obj.resize(
                          (
                              int(obj.width*scale),
                              int(obj.height*scale)
                          )
                      )

                      ox = x + dx - obj.width//2
                      oy = y + dy - obj.height//2

                      img.alpha_composite(
                          obj,
                          (ox,oy)
                      )

                  # animated timer

                  remaining = max(
                      1,
                      10-int(elapsed)
                  )

                  rounded_text(
                      img,
                      f"{remaining}",
                      1660,
                      f_big,
                      (255,80,105)
                  )

                  rounded_text(
                      img,
                      "SECONDS!",
                      1820,
                      f_small,
                      (40,55,90)
                  )

              # --------------------------------------------
              # COUNTDOWN 13-16
              # --------------------------------------------

              elif t < 16:

                  cd = 3 - int(t-13)

                  local = (t-13) % 1

                  scale = 1.0 + 0.25 * (
                      1-local
                  )

                  rounded_text(
                      img,
                      "TIME!",
                      370,
                      f_title,
                      (255,255,255)
                  )

                  obj = Image.new(
                      "RGBA",
                      (500,500),
                      (0,0,0,0)
                  )

                  od = ImageDraw.Draw(obj)

                  od.ellipse(
                      (50,50,450,450),
                      fill=(255,205,55)
                  )

                  txt = str(cd)

                  box = od.textbbox(
                      (0,0),
                      txt,
                      font=f_big
                  )

                  tw = box[2]-box[0]
                  th = box[3]-box[1]

                  od.text(
                      (
                          250-tw//2,
                          250-th//2-15
                      ),
                      txt,
                      font=f_big,
                      fill=(45,35,80)
                  )

                  obj = obj.resize(
                      (
                          int(500*scale),
                          int(500*scale)
                      )
                  )

                  img.alpha_composite(
                      obj,
                      (
                          (W-obj.width)//2,
                          650-(obj.height-500)//2
                      )
                  )

                  rounded_text(
                      img,
                      "DID YOU FIND IT?",
                      1300,
                      f_medium,
                      (100,235,255)
                  )

              # --------------------------------------------
              # REVEAL 16-20
              # --------------------------------------------

              else:

                  local = t-16

                  flash = max(
                      0,
                      1-local*2
                  )

                  # confetti
                  for i in range(45):

                      random.seed(
                          i*17
                      )

                      cx = (
                          random.randint(
                              30,
                              W-30
                          )
                          + int(
                              local*(
                                  random.randint(
                                      -100,
                                      100
                                  )
                              )
                          )
                      )

                      cy = (
                          random.randint(
                              300,
                              1750
                          )
                          + int(
                              local*300
                          )
                      )

                      r = random.randint(
                          5,
                          13
                      )

                      d.ellipse(
                          (
                              cx-r,
                              cy-r,
                              cx+r,
                              cy+r
                          ),
                          fill=random.choice(
                              [
                                  (255,80,110),
                                  (255,215,50),
                                  (70,190,255),
                                  (90,220,150),
                                  (170,100,255)
                              ]
                          )
                      )

                  rounded_text(
                      img,
                      "TIME'S UP!",
                      300,
                      f_title,
                      (255,255,255)
                  )

                  rounded_text(
                      img,
                      "HERE IT IS!",
                      430,
                      f_medium,
                      (255,235,70)
                  )

                  pulse = 1 + 0.15 * math.sin(
                      local*8
                  )

                  obj = circle_object(
                      target,
                      120
                  )

                  obj = obj.resize(
                      (
                          int(obj.width*pulse),
                          int(obj.height*pulse)
                      )
                  )

                  # glow
                  glow = Image.new(
                      "RGBA",
                      img.size,
                      (0,0,0,0)
                  )

                  gd = ImageDraw.Draw(
                      glow
                  )

                  gd.ellipse(
                      (
                          270,
                          650,
                          810,
                          1190
                      ),
                      fill=(255,240,80,100)
                  )

                  glow = glow.filter(
                      ImageFilter.GaussianBlur(
                          35
                      )
                  )

                  img.alpha_composite(
                      glow
                  )

                  img.alpha_composite(
                      obj,
                      (
                          (W-obj.width)//2,
                          700
                      )
                  )

                  rounded_text(
                      img,
                      "GREAT JOB!",
                      1280,
                      f_title,
                      (255,235,70)
                  )

                  rounded_text(
                      img,
                      "PLAY AGAIN!",
                      1450,
                      f_medium,
                      (100,235,255)
                  )

              # --------------------------------------------
              # SAVE FRAME
              # --------------------------------------------

              img.convert("RGB").save(
                  f"frames/frame_{frame:05d}.jpg",
                  quality=92
              )

          print("600 animated frames created.")

          PY

      # --------------------------------------------------
      # VOICE
      # --------------------------------------------------

      - name: Prepare voice
        env:
          VOICE_URL: ${{ inputs.voice_url }}
        run: |

          if [ -n "$VOICE_URL" ]; then

            echo "Downloading ElevenLabs voice..."

            curl -L \
              "$VOICE_URL" \
              -o audio/voice.mp3

            ffmpeg -y \
              -i audio/voice.mp3 \
              -ar 44100 \
              -ac 2 \
              audio/voice.wav

          else

            echo "No ElevenLabs voice supplied."
            echo "Using temporary fallback voice."

            espeak-ng \
              -v en-us+f3 \
              -s 155 \
              -p 65 \
              -a 170 \
              -w audio/voice.wav \
              "Hey Yappu TV friends! Can you find the hidden $TARGET? Look carefully! You have ten seconds! Three, two, one! Time's up! Did you find it? Great job!"

          fi

      # --------------------------------------------------
      # FINAL VIDEO
      # --------------------------------------------------

      - name: Render final MP4
        run: |

          ffmpeg -y \
            -framerate 30 \
            -i frames/frame_%05d.jpg \
            -i audio/voice.wav \
            -map 0:v \
            -map 1:a \
            -t 20 \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            output/yappu-video.mp4

      # --------------------------------------------------
      # UPLOAD
      # --------------------------------------------------

      - name: Upload video artifact
        uses: actions/upload-artifact@v4

        with:
          name: yappu-tv-video-v3
          path: output/yappu-video.mp4
