name: Yappu TV Video Renderer

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "Find the Hidden Apple"

      duration:
        description: "Video duration in seconds"
        required: true
        default: "20"

      voice_url:
        description: "ElevenLabs voice file URL (optional)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil espeak-ng

      - name: Find Yappu TV logo
        run: |
          LOGO_PATH=$(find . -type f -name "yappu-logo.png" | head -n 1)

          if [ -z "$LOGO_PATH" ]; then
            echo "ERROR: yappu-logo.png not found in repository"
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Yappu TV logo found at: $LOGO_PATH"
          cp "$LOGO_PATH" yappu-logo.png

      - name: Create animated video frames
        env:
          TOPIC: ${{ inputs.topic }}

        run: |

          mkdir -p output frames audio

          TL=$(echo "$TOPIC" | tr '[:upper:]' '[:lower:]')

          if [[ "$TL" == *"rainbow"* ]]; then
            TARGET="RAINBOW"

          elif [[ "$TL" == *"dino"* || "$TL" == *"dinosaur"* ]]; then
            TARGET="DINO"

          elif [[ "$TL" == *"pen"* ]]; then
            TARGET="PEN"

          elif [[ "$TL" == *"star"* ]]; then
            TARGET="STAR"

          elif [[ "$TL" == *"heart"* ]]; then
            TARGET="HEART"

          elif [[ "$TL" == *"ball"* ]]; then
            TARGET="BALL"

          else
            TARGET="APPLE"
          fi

          export TARGET

          python3 <<'PY'

          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import os
          import math
          import random

          W = 1080
          H = 1920
          FPS = 30

          topic = os.environ.get(
              "TOPIC",
              "Find the Hidden Apple"
          )

          target = os.environ.get(
              "TARGET",
              "APPLE"
          )

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def get_font(size):
              try:
                  return ImageFont.truetype(
                      FONT,
                      size
                  )
              except:
                  return ImageFont.load_default()

          F_TITLE = get_font(88)
          F_BIG = get_font(150)
          F_MED = get_font(58)
          F_SMALL = get_font(42)

          # ---------------------------------------------
          # YAPPU TV LOGO
          # ---------------------------------------------

          logo = Image.open(
              "yappu-logo.png"
          ).convert("RGBA")

          logo_width = 220

          logo_height = int(
              logo.height *
              logo_width /
              logo.width
          )

          logo = logo.resize(
              (
                  logo_width,
                  logo_height
              ),
              Image.Resampling.LANCZOS
          )

          # ---------------------------------------------
          # TEXT
          # ---------------------------------------------

          def center_text(
              img,
              text,
              y,
              font,
              fill
          ):

              draw = ImageDraw.Draw(img)

              box = draw.textbbox(
                  (0, 0),
                  text,
                  font=font
              )

              width = box[2] - box[0]

              x = (
                  W - width
              ) // 2

              draw.text(
                  (
                      x + 5,
                      y + 6
                  ),
                  text,
                  font=font,
                  fill=(20,20,45,220)
              )

              draw.text(
                  (
                      x,
                      y
                  ),
                  text,
                  font=font,
                  fill=fill
              )

          # ---------------------------------------------
          # LOGO
          # ---------------------------------------------

          def add_logo(img):

              img.alpha_composite(
                  logo,
                  (
                      (W - logo.width) // 2,
                      25
                  )
              )

          # ---------------------------------------------
          # OBJECTS
          # ---------------------------------------------

          def make_object(
              kind,
              size=60
          ):

              s = size

              obj = Image.new(
                  "RGBA",
                  (
                      s * 3,
                      s * 3
                  ),
                  (0,0,0,0)
              )

              d = ImageDraw.Draw(obj)

              cx = s * 1.5
              cy = s * 1.5

              # APPLE
              if kind == "APPLE":

                  d.ellipse(
                      (
                          cx-s,
                          cy-s,
                          cx,
                          cy
                      ),
                      fill=(238,45,65,255)
                  )

                  d.ellipse(
                      (
                          cx,
                          cy-s,
                          cx+s,
                          cy
                      ),
                      fill=(238,45,65,255)
                  )

                  d.rectangle(
                      (
                          cx-5,
                          cy-s-25,
                          cx+5,
                          cy-s+5
                      ),
                      fill=(100,55,25,255)
                  )

                  d.ellipse(
                      (
                          cx+5,
                          cy-s-30,
                          cx+42,
                          cy-s
                      ),
                      fill=(55,190,90,255)
                  )

              # BALL
              elif kind == "BALL":

                  d.ellipse(
                      (
                          cx-s,
                          cy-s,
                          cx+s,
                          cy+s
                      ),
                      fill=(50,130,245,255)
                  )

                  d.arc(
                      (
                          cx-s//2,
                          cy-s//2,
                          cx+s//2,
                          cy+s//2
                      ),
                      0,
                      360,
                      fill="white",
                      width=8
                  )

              # STAR
              elif kind == "STAR":

                  points = []

                  for i in range(10):

                      angle = (
                          -math.pi / 2
                          +
                          i * math.pi / 5
                      )

                      radius = (
                          s
                          if i % 2 == 0
                          else s * 0.45
                      )

                      points.append(
                          (
                              cx +
                              math.cos(angle)
                              * radius,

                              cy +
                              math.sin(angle)
                              * radius
                          )
                      )

                  d.polygon(
                      points,
                      fill=(255,210,45,255)
                  )

              # HEART
              elif kind == "HEART":

                  d.ellipse(
                      (
                          cx-s,
                          cy-s//2,
                          cx,
                          cy+s
                      ),
                      fill=(250,55,100,255)
                  )

                  d.ellipse(
                      (
                          cx,
                          cy-s//2,
                          cx+s,
                          cy+s
                      ),
                      fill=(250,55,100,255)
                  )

                  d.polygon(
                      [
                          (
                              cx-s+5,
                              cy
                          ),
                          (
                              cx+s-5,
                              cy
                          ),
                          (
                              cx,
                              cy+s+s//2
                          )
                      ],
                      fill=(250,55,100,255)
                  )

              # PEN
              elif kind == "PEN":

                  d.rounded_rectangle(
                      (
                          cx-s//4,
                          cy-s,
                          cx+s//4,
                          cy+s
                      ),
                      radius=15,
                      fill=(50,100,230,255)
                  )

                  d.polygon(
                      [
                          (
                              cx-s//4,
                              cy+s
                          ),
                          (
                              cx+s//4,
                              cy+s
                          ),
                          (
                              cx,
                              cy+s+45
                          )
                      ],
                      fill=(70,70,80,255)
                  )

              # DINO
              elif kind == "DINO":

                  d.ellipse(
                      (
                          cx-s,
                          cy-s//2,
                          cx+s,
                          cy+s//2
                      ),
                      fill=(65,195,100,255)
                  )

                  d.ellipse(
                      (
                          cx+s//2,
                          cy-s,
                          cx+s*1.2,
                          cy-s//3
                      ),
                      fill=(65,195,100,255)
                  )

                  d.ellipse(
                      (
                          cx+s*0.86,
                          cy-s*0.76,
                          cx+s*0.99,
                          cy-s*0.63
                      ),
                      fill="white"
                  )

              return obj

          # ---------------------------------------------
          # FIXED PUZZLE
          # ---------------------------------------------

          rng = random.Random(topic)

          allowed = [
              "APPLE",
              "BALL",
              "STAR",
              "HEART",
              "DINO",
              "PEN"
          ]

          positions = []

          for row in range(5):

              for col in range(4):

                  positions.append(
                      (
                          155 + col * 255,
                          610 + row * 205
                      )
                  )

          hidden_index = rng.randrange(
              len(positions)
          )

          puzzle_objects = []

          for i in range(
              len(positions)
          ):

              puzzle_objects.append(
                  rng.choice(
                      allowed
                  )
              )

          puzzle_objects[
              hidden_index
          ] = target

          # ---------------------------------------------
          # 20 SECOND VIDEO
          # ---------------------------------------------

          TOTAL_FRAMES = 600

          for frame in range(
              TOTAL_FRAMES
          ):

              t = frame / FPS

              # -----------------------------------------
              # BACKGROUND
              # -----------------------------------------

              if t < 3:

                  background = (
                      38,
                      24,
                      88,
                      255
                  )

              elif t < 13:

                  background = (
                      246,
                      249,
                      255,
                      255
                  )

              elif t < 16:

                  background = (
                      38,
                      24,
                      82,
                      255
                  )

              else:

                  background = (
                      25,
                      110,
                      82,
                      255
                  )

              img = Image.new(
                  "RGBA",
                  (
                      W,
                      H
                  ),
                  background
              )

              draw = ImageDraw.Draw(
                  img
              )

              add_logo(img)

              # =========================================
              # HOOK
              # =========================================

              if t < 3:

                  center_text(
                      img,
                      "CAN YOU FIND IT?",
                      360,
                      F_TITLE,
                      (255,235,70,255)
                  )

                  pulse = (
                      1
                      +
                      0.10 *
                      math.sin(t * 8)
                  )

                  obj = make_object(
                      target,
                      95
                  )

                  obj = obj.resize(
                      (
                          int(
                              obj.width *
                              pulse
                          ),
                          int(
                              obj.height *
                              pulse
                          )
                      ),
                      Image.Resampling.LANCZOS
                  )

                  x = (
                      W - obj.width
                  ) // 2

                  y = (
                      760
                      +
                      int(
                          math.sin(t*6)
                          * 18
                      )
                  )

                  img.alpha_composite(
                      obj,
                      (
                          x,
                          y
                      )
                  )

                  center_text(
                      img,
                      "GET READY!",
                      1430,
                      F_MED,
                      (100,235,255,255)
                  )

              # =========================================
              # PUZZLE
              # =========================================

              elif t < 13:

                  center_text(
                      img,
                      "FIND THE HIDDEN",
                      190,
                      F_MED,
                      (35,45,80,255)
                  )

                  center_text(
                      img,
                      target,
                      275,
                      F_TITLE,
                      (245,70,100,255)
                  )

                  elapsed = t - 3

                  for i in range(
                      len(positions)
                  ):

                      x, y = positions[i]

                      kind = puzzle_objects[i]

                      dx = int(
                          math.sin(
                              elapsed*2
                              +
                              i*0.7
                          ) * 7
                      )

                      dy = int(
                          math.cos(
                              elapsed*2.3
                              +
                              i*0.6
                          ) * 6
                      )

                      pulse = (
                          0.96
                          +
                          0.06 *
                          math.sin(
                              elapsed*3+i
                          )
                      )

                      obj = make_object(
                          kind,
                          54
                      )

                      obj = obj.resize(
                          (
                              int(
                                  obj.width *
                                  pulse
                              ),
                              int(
                                  obj.height *
                                  pulse
                              )
                          ),
                          Image.Resampling.LANCZOS
                      )

                      img.alpha_composite(
                          obj,
                          (
                              x
                              +
                              dx
                              -
                              obj.width//2,

                              y
                              +
                              dy
                              -
                              obj.height//2
                          )
                      )

                  remaining = max(
                      1,
                      10 - int(elapsed)
                  )

                  center_text(
                      img,
                      str(remaining),
                      1660,
                      F_BIG,
                      (255,80,105,255)
                  )

                  center_text(
                      img,
                      "SECONDS!",
                      1815,
                      F_SMALL,
                      (40,55,90,255)
                  )

              # =========================================
              # COUNTDOWN
              # =========================================

              elif t < 16:

                  countdown = (
                      3
                      -
                      int(t - 13)
                  )

                  local = (
                      t - 13
                  ) % 1

                  scale = (
                      1
                      +
                      0.22 *
                      (1-local)
                  )

                  center_text(
                      img,
                      "TIME!",
                      350,
                      F_TITLE,
                      (255,255,255,255)
                  )

                  obj = Image.new(
                      "RGBA",
                      (
                          500,
                          500
                      ),
                      (0,0,0,0)
                  )

                  od = ImageDraw.Draw(
                      obj
                  )

                  od.ellipse(
                      (
                          50,
                          50,
                          450,
                          450
                      ),
                      fill=(255,205,55,255)
                  )

                  number = str(
                      countdown
                  )

                  box = od.textbbox(
                      (0,0),
                      number,
                      font=F_BIG
                  )

                  tw = (
                      box[2]
                      -
                      box[0]
                  )

                  th = (
                      box[3]
                      -
                      box[1]
                  )

                  od.text(
                      (
                          250 - tw//2,
                          250 - th//2 - 12
                      ),
                      number,
                      font=F_BIG,
                      fill=(45,35,80,255)
                  )

                  obj = obj.resize(
                      (
                          int(500*scale),
                          int(500*scale)
                      ),
                      Image.Resampling.LANCZOS
                  )

                  img.alpha_composite(
                      obj,
                      (
                          (W-obj.width)//2,
                          650
                      )
                  )

                  center_text(
                      img,
                      "DID YOU FIND IT?",
                      1300,
                      F_MED,
                      (100,235,255,255)
                  )

              # =========================================
              # REVEAL
              # =========================================

              else:

                  local = t - 16

                  # Confetti
                  for i in range(40):

                      rr = random.Random(
                          i * 991
                      )

                      x = (
                          rr.randint(
                              30,
                              W-30
                          )
                          +
                          int(
                              math.sin(
                                  local*3+i
                              )
                              *
                              local
                              *
                              80
                          )
                      )

                      y = (
                          rr.randint(
                              400,
                              1700
                          )
                          +
                          int(
                              local*100
                          )
                      )

                      r = rr.randint(
                          5,
                          12
                      )

                      draw.ellipse(
                          (
                              x-r,
                              y-r,
                              x+r,
                              y+r
                          ),
                          fill=rr.choice(
                              [
                                  (255,80,110,255),
                                  (255,215,50,255),
                                  (70,190,255,255),
                                  (90,220,150,255),
                                  (170,100,255,255)
                              ]
                          )
                      )

                  center_text(
                      img,
                      "TIME'S UP!",
                      280,
                      F_TITLE,
                      (255,255,255,255)
                  )

                  center_text(
                      img,
                      "HERE IT IS!",
                      420,
                      F_MED,
                      (255,235,70,255)
                  )

                  pulse = (
                      1
                      +
                      0.12 *
                      math.sin(
                          local*8
                      )
                  )

                  obj = make_object(
                      target,
                      125
                  )

                  obj = obj.resize(
                      (
                          int(
                              obj.width *
                              pulse
                          ),
                          int(
                              obj.height *
                              pulse
                          )
                      ),
                      Image.Resampling.LANCZOS
                  )

                  glow = Image.new(
                      "RGBA",
                      (
                          W,
                          H
                      ),
                      (0,0,0,0)
                  )

                  gd = ImageDraw.Draw(
                      glow
                  )

                  gd.ellipse(
                      (
                          260,
                          650,
                          820,
                          1210
                      ),
                      fill=(255,240,80,100)
                  )

                  glow = glow.filter(
                      ImageFilter.GaussianBlur(
                          35
                      )
                  )

                  img.alpha_composite(
                      glow
                  )

                  img.alpha_composite(
                      obj,
                      (
                          (W-obj.width)//2,
                          710
                      )
                  )

                  center_text(
                      img,
                      "GREAT JOB!",
                      1270,
                      F_TITLE,
                      (255,235,70,255)
                  )

                  center_text(
                      img,
                      "PLAY AGAIN!",
                      1450,
                      F_MED,
                      (100,235,255,255)
                  )

              # -----------------------------------------
              # SAVE FRAME
              # -----------------------------------------

              img.convert(
                  "RGB"
              ).save(
                  f"frames/frame_{frame:05d}.jpg",
                  quality=90
              )

          print(
              "Created 600 animated frames."
          )

          PY

      - name: Prepare voice
        env:
          VOICE_URL: ${{ inputs.voice_url }}
          TOPIC: ${{ inputs.topic }}

        run: |

          if [ -n "$VOICE_URL" ]; then

            echo "Downloading ElevenLabs voice..."

            curl -L --fail \
              "$VOICE_URL" \
              -o audio/voice.mp3

            ffmpeg -y \
              -i audio/voice.mp3 \
              -ar 44100 \
              -ac 2 \
              audio/voice.wav

          else

            echo "No ElevenLabs voice supplied."
            echo "Using temporary fallback voice."

            TL=$(echo "$TOPIC" | tr '[:upper:]' '[:lower:]')

            if [[ "$TL" == *"rainbow"* ]]; then
              TARGET="rainbow"

            elif [[ "$TL" == *"dino"* || "$TL" == *"dinosaur"* ]]; then
              TARGET="dinosaur"

            elif [[ "$TL" == *"pen"* ]]; then
              TARGET="pen"

            elif [[ "$TL" == *"star"* ]]; then
              TARGET="star"

            elif [[ "$TL" == *"heart"* ]]; then
              TARGET="heart"

            elif [[ "$TL" == *"ball"* ]]; then
              TARGET="ball"

            else
              TARGET="apple"
            fi

            espeak-ng \
              -v en-us+f3 \
              -s 155 \
              -p 65 \
              -a 170 \
              -w audio/voice.wav \
              "Hey Yappu TV friends! Can you find the hidden $TARGET? Look carefully! You have ten seconds! Three, two, one! Time's up! Did you find it? Great job!"

          fi

      - name: Render final MP4
        run: |

          ffmpeg -y \
            -framerate 30 \
            -i frames/frame_%05d.jpg \
            -i audio/voice.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -t 20 \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            output/yappu-video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4

        with:
          name: yappu-tv-video-v3
          path: output/yappu-video.mp4
