name: Yappu TV Video Renderer

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "Find the Hidden Apple"
      duration:
        description: "Video duration in seconds"
        required: true
        default: "20"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil espeak-ng

      - name: Create Yappu TV Creative V2 video
        env:
          TOPIC: ${{ inputs.topic }}
          DURATION: ${{ inputs.duration }}
        run: |
          mkdir -p output frames audio

          # Detect target object for voice
          T="$TOPIC"
          TL=$(echo "$T" | tr '[:upper:]' '[:lower:]')

          if [[ "$TL" == *"rainbow"* ]]; then
            TARGET="RAINBOW"
          elif [[ "$TL" == *"dino"* || "$TL" == *"dinosaur"* ]]; then
            TARGET="DINOSAUR"
          elif [[ "$TL" == *"pen"* ]]; then
            TARGET="PEN"
          elif [[ "$TL" == *"star"* ]]; then
            TARGET="STAR"
          elif [[ "$TL" == *"heart"* ]]; then
            TARGET="HEART"
          elif [[ "$TL" == *"ball"* ]]; then
            TARGET="BALL"
          else
            TARGET="APPLE"
          fi

          export TARGET

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, random, math

          topic = os.environ.get("TOPIC", "Find the Hidden Apple")
          target = os.environ.get("TARGET", "APPLE")

          W, H = 1080, 1920

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          try:
              font_huge = ImageFont.truetype(font_path, 125)
              font_big = ImageFont.truetype(font_path, 88)
              font_medium = ImageFont.truetype(font_path, 58)
              font_small = ImageFont.truetype(font_path, 42)
              font_brand = ImageFont.truetype(font_path, 58)
          except:
              font_huge = font_big = font_medium = font_small = font_brand = ImageFont.load_default()

          COLORS = [
              (255, 92, 130),
              (75, 160, 255),
              (255, 205, 65),
              (75, 210, 175),
              (170, 105, 255),
              (255, 145, 75)
          ]

          def center_text(draw, text, y, font, fill):
              box = draw.textbbox((0,0), text, font=font)
              tw = box[2] - box[0]
              x = (W - tw) // 2

              draw.text(
                  (x+4, y+5),
                  text,
                  font=font,
                  fill=(20,20,40)
              )

              draw.text(
                  (x, y),
                  text,
                  font=font,
                  fill=fill
              )

          def brand(draw):
              # Stylish rounded Yappu TV badge
              draw.rounded_rectangle(
                  (285, 45, 795, 145),
                  radius=45,
                  fill=(255,255,255),
                  outline=(255,100,160),
                  width=7
              )

              box = draw.textbbox((0,0), "YAPPU TV", font=font_brand)
              tw = box[2]-box[0]

              draw.text(
                  ((W-tw)//2, 60),
                  "YAPPU TV",
                  font=font_brand,
                  fill=(255,85,145)
              )

          def sparkles(draw, count=35):
              for i in range(count):
                  x = random.randint(30, W-30)
                  y = random.randint(180, H-100)
                  r = random.randint(3, 11)
                  c = COLORS[i % len(COLORS)]
                  draw.ellipse(
                      (x-r, y-r, x+r, y+r),
                      fill=c
                  )

          def draw_object(draw, kind, x, y, size, muted=False):
              if kind == "APPLE":
                  c = (210,210,215) if muted else (235,45,60)

                  draw.ellipse(
                      (x-size,y-size,x,y),
                      fill=c
                  )

                  draw.ellipse(
                      (x,y-size,x+size,y),
                      fill=c
                  )

                  draw.rectangle(
                      (x-5,y-size-32,x+5,y-size+5),
                      fill=(100,60,30)
                  )

                  draw.ellipse(
                      (x+5,y-size-38,x+48,y-size-8),
                      fill=(45,180,80)
                  )

              elif kind == "BALL":
                  c = (210,210,215) if muted else (40,125,255)
                  draw.ellipse(
                      (x-size,y-size,x+size,y+size),
                      fill=c
                  )

                  draw.arc(
                      (x-size//2,y-size//2,
                       x+size//2,y+size//2),
                      0,360,
                      fill=(255,255,255),
                      width=7
                  )

              elif kind == "STAR":
                  c = (210,210,215) if muted else (255,205,30)

                  pts=[]

                  for i in range(10):
                      a = -math.pi/2 + i*math.pi/5
                      r = size if i%2==0 else size*0.45
                      pts.append(
                          (
                              x+math.cos(a)*r,
                              y+math.sin(a)*r
                          )
                      )

                  draw.polygon(pts, fill=c)

              elif kind == "HEART":
                  c = (210,210,215) if muted else (245,45,90)

                  draw.ellipse(
                      (x-size,y-size//2,x,y+size),
                      fill=c
                  )

                  draw.ellipse(
                      (x,y-size//2,x+size,y+size),
                      fill=c
                  )

                  draw.polygon(
                      [
                          (x-size+5,y),
                          (x+size-5,y),
                          (x,y+size+size//2)
                      ],
                      fill=c
                  )

              elif kind == "PEN":
                  c = (210,210,215) if muted else (40,90,220)

                  draw.rounded_rectangle(
                      (
                          x-size//4,
                          y-size,
                          x+size//4,
                          y+size
                      ),
                      radius=20,
                      fill=c
                  )

                  draw.polygon(
                      [
                          (x-size//4,y+size),
                          (x+size//4,y+size),
                          (x,y+size+55)
                      ],
                      fill=c
                  )

              elif kind == "DINO":
                  c = (210,210,215) if muted else (55,190,100)

                  draw.ellipse(
                      (
                          x-size,
                          y-size//2,
                          x+size,
                          y+size//2
                      ),
                      fill=c
                  )

                  draw.ellipse(
                      (
                          x+size//2,
                          y-size,
                          x+size*1.25,
                          y-size//3
                      ),
                      fill=c
                  )

                  draw.polygon(
                      [
                          (x-size,y),
                          (x-size-85,y-size//2),
                          (x-size-60,y+45)
                      ],
                      fill=c
                  )

              elif kind == "RAINBOW":
                  rainbow = [
                      (255,60,60),
                      (255,150,40),
                      (255,220,50),
                      (70,190,90),
                      (60,130,240),
                      (150,80,220)
                  ]

                  width = size//4

                  for i,c in enumerate(rainbow):
                      r = size-i*width//2

                      draw.arc(
                          (
                              x-r,
                              y-r,
                              x+r,
                              y+r
                          ),
                          180,
                          360,
                          fill=c,
                          width=width
                      )

          # ---------------- HOOK ----------------

          random.seed(42)

          img = Image.new(
              "RGB",
              (W,H),
              (38,25,88)
          )

          d = ImageDraw.Draw(img)

          sparkles(d,55)
          brand(d)

          center_text(
              d,
              "CAN YOU FIND IT?",
              360,
              font_big,
              (255,235,80)
          )

          center_text(
              d,
              target,
              500,
              font_huge,
              (255,255,255)
          )

          center_text(
              d,
              "LET'S PLAY!",
              1500,
              font_medium,
              (100,235,255)
          )

          img.save("frames/scene1.png")

          # ---------------- PUZZLE ----------------

          random.seed(topic)

          img = Image.new(
              "RGB",
              (W,H),
              (246,249,255)
          )

          d = ImageDraw.Draw(img)

          brand(d)

          center_text(
              d,
              "FIND THE HIDDEN",
              190,
              font_medium,
              (35,45,80)
          )

          center_text(
              d,
              target,
              280,
              font_big,
              (255,75,100)
          )

          positions=[]

          for row in range(5):
              for col in range(4):
                  positions.append(
                      (
                          160+col*250,
                          620+row*210
                      )
                  )

          hidden_index = random.randrange(len(positions))

          allowed = [
              "APPLE",
              "BALL",
              "STAR",
              "HEART"
          ]

          for i,(x,y) in enumerate(positions):

              kind = random.choice(allowed)

              if i == hidden_index:
                  kind = target

              draw_object(
                  d,
                  kind,
                  x,
                  y,
                  65,
                  i != hidden_index
              )

          center_text(
              d,
              "10 SECONDS!",
              1740,
              font_small,
              (45,55,95)
          )

          img.save("frames/scene2.png")

          # ---------------- COUNTDOWN ----------------

          for n in [3,2,1]:

              img = Image.new(
                  "RGB",
                  (W,H),
                  (35,25,78)
              )

              d = ImageDraw.Draw(img)

              sparkles(d,40)
              brand(d)

              center_text(
                  d,
                  "KEEP LOOKING!",
                  350,
                  font_medium,
                  (255,255,255)
              )

              center_text(
                  d,
                  str(n),
                  650,
                  font_huge,
                  (255,220,55)
              )

              center_text(
                  d,
                  "GO!",
                  930,
                  font_medium,
                  (100,235,255)
              )

              img.save(
                  f"frames/count{n}.png"
              )

          # ---------------- REVEAL ----------------

          img = Image.new(
              "RGB",
              (W,H),
              (20,105,78)
          )

          d = ImageDraw.Draw(img)

          sparkles(d,60)
          brand(d)

          center_text(
              d,
              "TIME'S UP!",
              250,
              font_big,
              (255,255,255)
          )

          center_text(
              d,
              "DID YOU FIND IT?",
              390,
              font_medium,
              (255,235,70)
          )

          draw_object(
              d,
              target,
              W//2,
              850,
              190,
              False
          )

          center_text(
              d,
              "YES! THERE IT IS!",
              1200,
              font_medium,
              (255,255,255)
          )

          center_text(
              d,
              "GREAT JOB!",
              1340,
              font_big,
              (255,235,70)
          )

          center_text(
              d,
              "PLAY AGAIN!",
              1510,
              font_medium,
              (100,235,255)
          )

          img.save("frames/reveal.png")
          PY

          # ---------------- VOICE ----------------

          espeak-ng \
            -v en-us+f3 \
            -s 155 \
            -p 65 \
            -a 170 \
            -w audio/voice.wav \
            "Hey Yappu TV friends! Can you find the hidden $TARGET? Look carefully! You have ten seconds! Three... two... one... Time's up! Did you find it? Great job!"

          # ---------------- CREATIVE ANIMATION ----------------

          ffmpeg -y \
            -loop 1 -i frames/scene1.png \
            -loop 1 -i frames/scene2.png \
            -loop 1 -i frames/count3.png \
            -loop 1 -i frames/count2.png \
            -loop 1 -i frames/count1.png \
            -loop 1 -i frames/reveal.png \
            -i audio/voice.wav \
            -filter_complex "

              [0:v]
              scale=1080:1920,
              zoompan=
              z='min(zoom+0.0008,1.08)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=90:
              s=1080x1920:
              fps=30,
              trim=duration=3,
              setpts=PTS-STARTPTS[v0];

              [1:v]
              scale=1080:1920,
              zoompan=
              z='1.0+0.04*sin(on/18)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=300:
              s=1080x1920:
              fps=30,
              trim=duration=10,
              setpts=PTS-STARTPTS[v1];

              [2:v]
              scale=1080:1920,
              zoompan=
              z='1.0+0.10*sin(on/8)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=30:
              s=1080x1920:
              fps=30,
              trim=duration=1,
              setpts=PTS-STARTPTS[v2];

              [3:v]
              scale=1080:1920,
              zoompan=
              z='1.0+0.10*sin(on/8)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=30:
              s=1080x1920:
              fps=30,
              trim=duration=1,
              setpts=PTS-STARTPTS[v3];

              [4:v]
              scale=1080:1920,
              zoompan=
              z='1.0+0.10*sin(on/8)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=30:
              s=1080x1920:
              fps=30,
              trim=duration=1,
              setpts=PTS-STARTPTS[v4];

              [5:v]
              scale=1080:1920,
              zoompan=
              z='1.0+0.12*sin(on/12)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=120:
              s=1080x1920:
              fps=30,
              trim=duration=4,
              setpts=PTS-STARTPTS[v5];

              [v0][v1][v2][v3][v4][v5]
              concat=n=6:v=1:a=0[outv]
            " \
            -map "[outv]" \
            -map 6:a \
            -t 20 \
            -r 30 \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            output/yappu-video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: yappu-tv-video
          path: output/yappu-video.mp4
